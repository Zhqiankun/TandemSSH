name: CI
on:
  push:
    branches: [main, "codex/**"]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true
jobs:
  windows:
    runs-on: windows-2022
    timeout-minutes: 45
    defaults:
      run:
        working-directory: app
        shell: pwsh
    env:
      TANDEM_PTY_LONG_ROOT: "1"
      TANDEM_PTY_TRACE: "1"
      VITE_CONFIG_NATIVE_IGNORE_WARNING: "true"
      TANDEM_TEST_BASH: C:\Program Files\Git\bin\bash.exe
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24.20.0
          cache: npm
          cache-dependency-path: app/package-lock.json
      - name: Install locked dependencies
        run: npm ci
      - name: Check types and schema
        run: |
          npm run type-check
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          npm run schema:check
      - name: Check lint and Chinese translation keys
        run: |
          npm run lint
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          node scripts/check-localization.cjs
      - name: Run all tests
        run: npm test
      - name: Build application
        run: npm run build
      - name: Verify Spectre-enabled MSVC toolchain
        if: github.event_name != 'pull_request'
        run: |
          $vswhere = Join-Path ${env:ProgramFiles(x86)} 'Microsoft Visual Studio/Installer/vswhere.exe'
          $compiler = & $vswhere -latest -products '*' -requires Microsoft.VisualStudio.Component.VC.Runtimes.x86.x64.Spectre -property installationPath
          if (-not $compiler) { throw 'Spectre-enabled MSVC libraries are required for the native build' }
      - name: Build Windows preview installers
        if: github.event_name != 'pull_request'
        run: npm run build:win-installer
      - name: Verify packaged native modules
        if: github.event_name != 'pull_request'
        run: node scripts/verify-native-package.cjs
      - name: Preserve Windows preview installers
        if: github.event_name != 'pull_request'
        uses: actions/upload-artifact@v7
        with:
          name: TandemSSH-Windows-preview
          path: |
            app/release/TandemSSH-*-x64.exe
            app/release/TandemSSH-*-x64.zip
          retention-days: 14
          if-no-files-found: error
      - name: Preserve terminal fixture traces
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: TandemSSH-terminal-fixture-traces
          path: .cache/pty-tests/*.trace.json
          retention-days: 3
          if-no-files-found: ignore
      - name: Preserve build output
        uses: actions/upload-artifact@v7
        with:
          name: TandemSSH-source-build-${{ github.sha }}
          path: app/dist
          retention-days: 7
          if-no-files-found: error
